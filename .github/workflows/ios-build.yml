name: iOS Build (unsigned ipa)

# 手动触发：GitHub 仓库页面 → Actions → iOS Build → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    # GitHub 提供的 macOS 云机器（自带 Xcode 26.x，兼容本项目 min iOS 16）
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/PetApp
        run: xcodegen

      - name: Show schemes
        working-directory: ios/PetApp
        run: xcodebuild -list -project PetApp.xcodeproj

      - name: Build unsigned .ipa (兜底渲染分支，无需 Cubism SDK)
        working-directory: ios/PetApp
        run: |
          xcodebuild \
            -project PetApp.xcodeproj \
            -scheme PetApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tail -30

      - name: Package .ipa
        run: |
          mkdir -p dist/Payload
          cp -r ios/PetApp/build/Build/Products/Release-iphoneos/PetApp.app dist/Payload/
          cd dist && zip -qry PetApp-unsigned.ipa Payload
          ls -la PetApp-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetApp-unsigned-ipa
          path: dist/PetApp-unsigned.ipa
